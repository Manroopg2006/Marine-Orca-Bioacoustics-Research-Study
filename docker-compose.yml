services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://orcapath:orcapath@db:5432/orcapath}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orcapath
      POSTGRES_USER: orcapath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcapath}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcapath -d orcapath"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
