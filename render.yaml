services:
  - type: web
    name: orcapath-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ORCA_MODEL_PATH
        value: /app/src/models/orca_detector.pkl
      - key: PUBLIC_HISTORY_ENABLED
        value: "false"
